<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#f6f8fc"/><title>운동로그 · 내 운동 기록</title>
<style>
:root{--bg:#f6f8fc;--ink:#172644;--muted:#7b879b;--line:#e6ebf3;--blue:#4967ea;--mint:#1b9c80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}.app{max-width:560px;margin:auto;padding:22px 17px 105px}
header{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.logo{font-weight:850;font-size:19px;letter-spacing:-.5px}.small,.sub{color:var(--muted);font-size:12px}.sub{margin-top:4px}.pill{padding:6px 10px;border-radius:100px;background:white;border:1px solid var(--line);font-size:11px;font-weight:750;color:#576a85}
.hero{background:linear-gradient(135deg,#17294b,#2b4478);border-radius:24px;padding:23px;color:white;box-shadow:0 12px 27px #1b3b7020}.hero h1{font-size:25px;letter-spacing:-.7px;margin:9px 0 3px}.hero p{color:#b9cbeb;font-size:13px;margin:0}.stats{display:flex;justify-content:space-between;align-items:flex-end;margin-top:19px}.stats strong{font-size:22px}.stats span{color:#b9c7e1;font-size:11px}.bar{height:8px;border-radius:20px;background:#ffffff35;margin-top:10px;overflow:hidden}.bar>div{height:100%;background:#a8e6d0;border-radius:20px}
h2{font-size:18px;margin:24px 2px 12px;letter-spacing:-.4px}.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #172b4810;padding:17px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{font-size:12px;color:var(--muted)}.ex-title{font-size:15px;font-weight:800}.ex-sub{color:var(--muted);font-size:11px;margin:4px 0 14px}
.fields{display:grid;grid-template-columns:30px 1fr 1fr 47px;gap:8px;align-items:center;margin-top:8px}.fields.head{font-size:11px;color:#94a0b0;text-align:center;font-weight:700}.index{text-align:center;color:#8491a7;font-size:12px}
input,select{border:1px solid #e4e9f1;background:#f9fafc;color:var(--ink);font:inherit;border-radius:10px;padding:11px;min-width:0;max-width:100%}input[type=number]{width:100%;text-align:center;font-weight:750;font-size:15px;padding:10px 2px}input[type=date]{padding:8px;font-size:12px}.btn{cursor:pointer;background:white;border:1px solid #dae1ed;border-radius:11px;padding:10px 12px;color:#314464;font-weight:750;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{background:var(--blue);color:white;border-color:var(--blue);padding:15px;width:100%;font-size:15px}.btn.danger{color:#c15565;border-color:#f0dae0}.btn.tiny{border:0;padding:6px 0;color:var(--blue);font-size:12px;background:transparent}.btn.checked{background:#e5f8f0;border-color:#a4e0ca;color:#008d72;font-size:18px;font-weight:900;padding:7px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.buttons>*{flex:1}.notice{padding:12px 13px;border-radius:12px;background:#ebefff;color:#4c608f;font-size:12px;margin:13px 0;line-height:1.6}.cloud{border:1px solid #d5e8df;background:#f0faf5;color:#187e67;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:14px}.cloud.warn{background:#fff7ea;border-color:#fae3bb;color:#966b25}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:block;margin:12px 0 4px;font-size:12px;font-weight:700;color:#69758a}.full{width:100%}.history-date{font-weight:800;font-size:17px}.history-stat{display:flex;gap:20px;margin:14px 0 6px;border-top:1px solid var(--line);padding-top:12px}.history-stat span{color:#8793a8;font-size:11px}.history-stat strong{display:block;color:var(--ink);font-size:19px}.line{border-top:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:10px;font-size:12px}.line b{font-size:12px}.line span{text-align:right}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.bottom button{width:min(25%,140px);border:0;background:transparent;color:#929eb0;padding:8px;border-radius:12px;font-size:12px;font-weight:800}.bottom .active{color:var(--blue);background:#edf1ff}.hidden{display:none!important}.saving{opacity:.65;pointer-events:none}.help{font-size:11px;color:var(--muted);margin:12px 0;line-height:1.65}

.weight-hero{background:#f9fcff;border:1px solid #dfebf8;border-radius:20px;padding:20px;margin-bottom:13px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}.metric{padding:13px;border-radius:13px;background:white;border:1px solid #e2eaf2}.metric small{display:block;color:#71839b;font-size:11px}.metric strong{font-size:23px;letter-spacing:-.4px}.metric .positive{color:#c75f55}.metric .negative{color:#178b6b}.body-head{display:flex;align-items:flex-end;gap:12px;justify-content:space-between}.bmi-big{font-size:44px;font-weight:850;letter-spacing:-1.4px;line-height:1.1}.bmi-tag{display:inline-block;font-size:12px;background:#e5edf9;color:#34558d;border-radius:15px;padding:5px 10px;font-weight:750}.chart-wrap{overflow:hidden;border-radius:12px;background:#fafbff;padding:12px 6px 4px}.chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}.chart-wrap .grid-line{stroke:#dce4f2;stroke-dasharray:3 4;stroke-width:1}.chart-wrap .chart-label{fill:#8394ae;font-size:11px}.range-pills{display:flex;gap:5px}.range-pills button{padding:7px 10px;font-size:11px}.range-pills .on{background:#eaf0ff;color:#4967ea;border-color:#c8d5ff}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry-grid input{width:100%;font-size:15px}.weight-row{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.weight-row:first-child{border:0}.weight-row .value{font-size:18px;font-weight:800}.weight-row .mini{display:flex;gap:5px}.weight-row .mini button{padding:7px 9px;font-size:11px}.footnote{color:#7e8ca4;font-size:11px;line-height:1.6}

/* Activity energy and food-equivalent cards */
.energy-card{border-radius:20px;background:linear-gradient(120deg,#eef4ff 0%,#f7fbff 90%);border:1px solid #dce7fa;padding:16px;margin:12px 0 13px}
.energy-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.energy-total{font-weight:860;color:#2b4ac5;letter-spacing:-.7px;font-size:26px}
.energy-label{font-weight:800;color:#243e6a;font-size:13px}
.energy-parts{display:flex;gap:10px;flex-wrap:wrap;padding-top:9px}
.energy-parts span{font-size:11px;color:#526882;background:#fff;padding:5px 9px;border-radius:12px;border:1px solid #dfe7f5}
.energy-compact{font-size:11px;color:#687d97;line-height:1.5;margin-top:9px}
.food-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.food-item{background:#fff;border:1px solid #e1e9f8;border-radius:13px;padding:10px;min-width:0}
.food-info{display:flex;align-items:center;gap:8px}.food-icon{font-size:26px}.food-name{font-weight:750;font-size:12px;color:#324664}.food-unit{font-size:10px;color:#8191aa}
.food-qty{font-weight:850;color:#1a355e;font-size:16px;white-space:nowrap}
.food-track{background:#edf1f8;border-radius:8px;height:5px;overflow:hidden;margin:9px 0 2px}
.food-fill{display:block;background:#6884ef;height:100%;border-radius:8px}
.energy-details{font-size:11px;color:#7185a1;margin-top:9px}
.energy-details summary{cursor:pointer;user-select:none;font-weight:700;color:#566e91}
.energy-details p{margin:8px 0 0;line-height:1.7}
.energy-empty{font-size:12px;color:#697a99;background:#f5f8ff;border-radius:12px;padding:13px;margin:8px 0 14px}

.cardio-entry{padding:11px 0;border-bottom:1px solid var(--line)}
.cardio-entry:last-of-type{border-bottom:0}
.cardio-entry>strong{display:block;margin:0 0 8px;font-size:13px}
.cardio-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) 43px;gap:9px;align-items:end}
.cardio-fields label{display:flex;flex-direction:column;gap:5px;min-width:0}
.cardio-fields label .muted{font-size:11px}
.cardio-fields input{width:100%;padding:10px 7px;font-size:15px;font-weight:700;text-align:center}
.cardio-fields button{height:43px;padding:6px;font-size:19px}
@media(max-width:360px){.cardio-fields{gap:5px}.cardio-fields label .muted{font-size:10px}}

/* Workout calendar */
.calendar-card{padding:16px 13px 13px;margin-top:18px}
.calendar-title{margin:2px 3px 8px}.calendar-title strong{font-size:20px;letter-spacing:-.4px}
.cal-navigation{display:flex;gap:5px;align-items:center}
.cal-navigation button{padding:7px 10px;border-radius:10px;font-size:13px;min-width:32px}
.calendar-summary{margin:0 4px 15px;font-size:12px;color:#70819a}
.calendar-summary b{color:#29496e}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-weekday{text-align:center;color:#8190a7;font-size:11px;font-weight:700;padding:4px 0 6px}
.calendar-weekday:nth-child(7){color:#cc6c69}
.calendar-blank{min-height:57px}
.calendar-day{border:1px solid #e8edf4;background:#f8faff;border-radius:10px;min-height:57px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font:inherit;font-size:12px;color:#748199;cursor:pointer}
.calendar-day.calendar-worked{background:#eaf1ff;border-color:#d2defc;color:#304da0;font-weight:800}
.calendar-day.calendar-today{box-shadow:inset 0 0 0 1.5px #8199f3}
.calendar-day.calendar-selected{background:#435ed0;border-color:#435ed0;color:#fff}
.calendar-dot{background:#5371e4;width:6px;height:6px;border-radius:50%}
.calendar-selected .calendar-dot{background:#fff}
.calendar-nodot{height:6px}
.calendar-day small{font-size:9px;line-height:1}
.calendar-legend{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:11px 4px 0;color:#8491a5;font-size:10px}
.calendar-legend>span:first-child{white-space:nowrap}
.calendar-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5371e4;vertical-align:middle;margin-right:4px}
/* BMI range bar with six medically-defined groups; marker follows current BMI */
.bmi-scale-card{padding:18px 16px}
.bmi-ruler{padding-top:40px;position:relative;margin:2px 0 22px}
.bmi-track{width:100%;height:15px;display:flex;position:relative;border-radius:9px;overflow:visible}
.bmi-band:first-child{border-radius:9px 0 0 9px}
.bmi-band:nth-child(6){border-radius:0 9px 9px 0}
.bmi-ticks{position:relative;height:22px;margin-top:3px}
.bmi-tick{position:absolute;top:0;transform:translateX(-50%);font-size:10px;font-weight:700;color:#8691a1;text-align:center}
.bmi-tick i{display:block;height:6px;width:1px;margin:-3px auto 3px;background:#8899ac}
.bmi-marker{position:absolute;z-index:2;top:-32px;transform:translateX(-50%);display:flex;align-items:center;flex-direction:column;gap:1px;pointer-events:none}
.bmi-marker-label{background:#293b5d;border-radius:8px;padding:3px 7px;font-size:11px;line-height:17px;font-weight:800;color:#fff;white-space:nowrap;box-shadow:0 2px 8px #2034552c}
.bmi-arrow{height:0;width:0;border:6px solid transparent;border-top-color:#293b5d;border-bottom:0}
.bmi-legend{display:flex;gap:7px 12px;flex-wrap:wrap;margin-top:4px}
.bmi-legend span{white-space:nowrap;font-size:10px;color:#728198}
.bmi-legend i,.bmi-row-name i{display:inline-block;vertical-align:middle;width:8px;height:8px;border-radius:50%;margin-right:4px}
.bmi-weight-heading{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:22px 0 7px}
.bmi-weight-heading strong{font-size:13px}
.bmi-weight-row{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px 10px;margin:2px 0;border-radius:8px;font-size:12px}
.bmi-weight-row:nth-child(odd){background:#f7f9fc}
.bmi-weight-active{background:#e9efff!important;border:1px solid #d3ddfb;padding:7px 9px;font-weight:800;color:#2849a4}
.bmi-row-name{min-width:0;white-space:nowrap}.bmi-row-value{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11px}
@media(max-width:360px){.calendar-grid{gap:3px}.calendar-day,.calendar-blank{min-height:52px}.calendar-legend{font-size:9px}.bmi-scale-card{padding:16px 12px}}

</style>
</head><body><main class="app"><header><div><div class="logo">▣ 운동로그</div><div class="small">MY FITNESS JOURNAL</div></div><div class="pill" id="week">주 3회 전신 운동</div></header><div id="cloud" class="cloud warn">GitHub 연결 전 · 관리 탭에서 연결해 주세요</div><div id="view"></div></main><nav class="bottom"><button type="button" data-tab="work" class="active">◉ 운동하기</button><button type="button" data-tab="history">▦ 운동 기록</button><button type="button" data-tab="body">◔ 체중·BMI</button><button type="button" data-tab="settings">⚙ 관리</button></nav><script src="./app.js?v=5" defer></script></body></html>
