<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#f6f8fc"/><title>운동로그 · 내 운동 기록</title>
<style>
:root{--bg:#f6f8fc;--ink:#172644;--muted:#7b879b;--line:#e6ebf3;--blue:#4967ea;--mint:#1b9c80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}.app{max-width:560px;margin:auto;padding:22px 17px 105px}
header{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.logo{font-weight:850;font-size:19px;letter-spacing:-.5px}.small,.sub{color:var(--muted);font-size:12px}.sub{margin-top:4px}.pill{padding:6px 10px;border-radius:100px;background:white;border:1px solid var(--line);font-size:11px;font-weight:750;color:#576a85}
.hero{background:linear-gradient(135deg,#17294b,#2b4478);border-radius:24px;padding:23px;color:white;box-shadow:0 12px 27px #1b3b7020}.hero h1{font-size:25px;letter-spacing:-.7px;margin:9px 0 3px}.hero p{color:#b9cbeb;font-size:13px;margin:0}.stats{display:flex;justify-content:space-between;align-items:flex-end;margin-top:19px}.stats strong{font-size:22px}.stats span{color:#b9c7e1;font-size:11px}.bar{height:8px;border-radius:20px;background:#ffffff35;margin-top:10px;overflow:hidden}.bar>div{height:100%;background:#a8e6d0;border-radius:20px}
h2{font-size:18px;margin:24px 2px 12px;letter-spacing:-.4px}.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #172b4810;padding:17px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{font-size:12px;color:var(--muted)}.ex-title{font-size:15px;font-weight:800}.ex-sub{color:var(--muted);font-size:11px;margin:4px 0 14px}
.fields{display:grid;grid-template-columns:30px 1fr 1fr 47px;gap:8px;align-items:center;margin-top:8px}.fields.head{font-size:11px;color:#94a0b0;text-align:center;font-weight:700}.index{text-align:center;color:#8491a7;font-size:12px}
input,select{border:1px solid #e4e9f1;background:#f9fafc;color:var(--ink);font:inherit;border-radius:10px;padding:11px;min-width:0;max-width:100%}input[type=number]{width:100%;text-align:center;font-weight:750;font-size:15px;padding:10px 2px}input[type=date]{padding:8px;font-size:12px}.btn{cursor:pointer;background:white;border:1px solid #dae1ed;border-radius:11px;padding:10px 12px;color:#314464;font-weight:750;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{background:var(--blue);color:white;border-color:var(--blue);padding:15px;width:100%;font-size:15px}.btn.danger{color:#c15565;border-color:#f0dae0}.btn.tiny{border:0;padding:6px 0;color:var(--blue);font-size:12px;background:transparent}.btn.checked{background:#e5f8f0;border-color:#a4e0ca;color:#008d72;font-size:18px;font-weight:900;padding:7px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.buttons>*{flex:1}.notice{padding:12px 13px;border-radius:12px;background:#ebefff;color:#4c608f;font-size:12px;margin:13px 0;line-height:1.6}.cloud{border:1px solid #d5e8df;background:#f0faf5;color:#187e67;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:14px}.cloud.warn{background:#fff7ea;border-color:#fae3bb;color:#966b25}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:block;margin:12px 0 4px;font-size:12px;font-weight:700;color:#69758a}.full{width:100%}.history-date{font-weight:800;font-size:17px}.history-stat{display:flex;gap:20px;margin:14px 0 6px;border-top:1px solid var(--line);padding-top:12px}.history-stat span{color:#8793a8;font-size:11px}.history-stat strong{display:block;color:var(--ink);font-size:19px}.line{border-top:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:10px;font-size:12px}.line b{font-size:12px}.line span{text-align:right}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.bottom button{width:min(32%,170px);border:0;background:transparent;color:#929eb0;padding:8px;border-radius:12px;font-size:12px;font-weight:800}.bottom .active{color:var(--blue);background:#edf1ff}.hidden{display:none!important}.saving{opacity:.65;pointer-events:none}.help{font-size:11px;color:var(--muted);margin:12px 0;line-height:1.65}
</style>
</head><body><main class="app"><header><div><div class="logo">▣ 운동로그</div><div class="small">MY FITNESS JOURNAL</div></div><div class="pill" id="week">주 3회 전신 운동</div></header><div id="cloud" class="cloud warn">GitHub 연결 전 · 관리 탭에서 연결해 주세요</div><div id="view"></div></main><nav class="bottom"><button type="button" data-tab="work" class="active">◉ 운동하기</button><button type="button" data-tab="history">▦ 운동 기록</button><button type="button" data-tab="settings">⚙ 관리</button></nav><script src="./app.js" defer></script></body></html>
